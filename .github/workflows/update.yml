name: Refresh data and deploy

on:
  schedule:
    - cron: "23 13 * * *"   # daily, ~9am ET: picks up last night's box scores and the morning injury report
    - cron: "41 21 * * *"   # ~5:40pm ET: refreshed injury report before tip-off
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Build model from hoopR data + ESPN injuries
        run: python scripts/build_data.py --refresh
      - name: Calibrate scoring, pace and rebounds
        run: node scripts/calibrate.js site/data/model.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
