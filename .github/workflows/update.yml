name: Refresh data and deploy

on:
  schedule:
    - cron: "23 13 * * *"   # daily, ~9am ET: picks up last night's box scores and the morning injury report
    - cron: "41 21 * * *"   # ~5:40pm ET: refreshed injury report before tip-off
  workflow_dispatch:         # "Run workflow" button in the Actions tab
    inputs:
      refresh_odds:
        description: "Fetch sportsbook prop lines again now (uses Odds API credits)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write   # the tracker commits each day's saved projections back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Build model from hoopR data + ESPN injuries
        run: python scripts/build_data.py --refresh
      - name: Calibrate scoring, pace and rebounds
        run: node scripts/calibrate.js site/data/model.json
      - name: "Season outlook: play out the rest of the season 10,000 times"
        run: node scripts/season.js site/data/model.json site/data/season.json
      - name: Sportsbook prop lines (needs the ODDS_API_KEY secret; skipped without it)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
          ODDS_FETCH: ${{ github.event_name == 'push' && '0' || '1' }}
          ODDS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_odds && '1' || '0' }}
        run: python scripts/fetch_odds.py
      - name: "Tracker: save today's projections and grade finished days"
        run: |
          node scripts/tracker.js project
          node scripts/tracker.js report

      - name: "Tracker: commit saved projections"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/
          if ! git diff --cached --quiet; then
            git commit -m "tracker: save projections/odds $(TZ=America/New_York date +%F) [skip ci]"
            # the rebuilt site/data files are uncommitted here, so set them aside while pulling;
            # if another run saved the same day's file in between, keep this run's (newer) copy; try 3 times
            ok=""
            for i in 1 2 3; do
              if git pull --rebase -X theirs --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            if [ -n "$ok" ]; then echo "::notice title=tracker::saved projections committed"
            else echo "::warning title=tracker::could not push saved projections (will retry next run)"; fi
          fi
      - name: Stamp file versions (so browsers load the new code)
        run: sed -i "s/__V__/${GITHUB_SHA::7}-$(date +%s)/g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing runs as its own job, after the build job has completely finished. When it ran right after the
  # upload in the same job, GitHub sometimes hadn't registered the upload yet ("No artifacts named github-pages").
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
